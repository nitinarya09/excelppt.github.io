Key advantages:
1. No column index number required – you specify exactly what you want to return
2. Can look left – unlike VLOOKUP which only looks right
3. Returns exact match by default – safer than VLOOKUP
4. Can search from bottom to top
5. Supports wildcards for partial matching
6. Built-in error handling

If you're still using VLOOKUP, I highly recommend switching to XLOOKUP for new work.`,content:i.jsxs("div",{children:[i.jsx(Xl,{subtitle:"The modern replacement for VLOOKUP & HLOOKUP",children:"What is XLOOKUP?"}),i.jsx(hm,{left:i.jsxs("div",{children:[i.jsx("h3",{className:"font-bold text-[15px] mb-3 text-green-700",children:"✅ XLOOKUP Advantages"}),i.jsx(Oa,{items:["Simpler syntax than VLOOKUP","Can look LEFT or RIGHT","Exact match is the default (safer)","No need to count columns","Built-in error handling","Can search from last to first"]})]}),right:i.jsxs("div",{children:[i.jsx("h3",{className:"font-bold text-[15px] mb-3 text-red-700",children:"❌ VLOOKUP Limitations"}),i.jsx(Oa,{items:["Only searches leftmost column","Requires column index number","Approximate match is default","Breaks if columns are added","No built-in error handling","Only searches top to bottom"]})]})}),i.jsxs(Fe,{type:"info",title:"Availability",children:["XLOOKUP is available in ",i.jsx("strong",{children:"Microsoft 365"}),", ",i.jsx("strong",{children:"Excel 2021"}),", and ",i.jsx("strong",{children:"Excel for the web"}),". Older versions require VLOOKUP or INDEX/MATCH instead."]})]})},{id:4,title:"XLOOKUP Syntax",duration:"5 min",lectureNotes:`Let's break down the XLOOKUP syntax. There are 6 parameters, but you typically only need the first 3.

XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found], [match_mode], [search_mode])

Required parameters:
1. lookup_value – The value you're searching for
2. lookup_array – Where to search (single column or row)
3. return_array – What to return when found

Optional parameters:
4. if_not_found – Custom message if no match (prevents #N/A error)
5. match_mode – 0=exact (default), -1=exact or smaller, 1=exact or larger, 2=wildcard
6. search_mode – 1=first to last (default), -1=last to first

For most cases, you'll just use the first 3 or 4 parameters.`,content:i.jsxs("div",{children:[i.jsx(Xl,{subtitle:"Understanding each parameter",children:"XLOOKUP Syntax Breakdown"}),i.jsx(Qt,{title:"XLOOKUP Formula Structure",code:`=XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found], [match_mode], [search_mode])

- Column A contains all Employee IDs
- Column E contains all Salaries

1. Search for "E003"
2. Look through the Employee_ID column
3. When found, return the corresponding Salary
4. If not found, display "Not Found"

A Pivot Table is an interactive way to summarize large amounts of data. You can:
- Quickly summarize thousands of rows
- Group data by categories
- Calculate totals, averages, counts, etc.
- Rearrange your view with drag and drop
- Filter and sort easily

Step 1: Select your data – click anywhere inside your data table. Excel will automatically detect the entire range.

Step 2: Insert Pivot Table – go to the Insert tab, click "PivotTable" on the left.

Step 3: Choose location – New Worksheet is recommended for learning. Click OK.

Step 4: Understanding the PivotTable Fields pane on the right side:
  • Filters: Add slicers at the top
  • Columns: Categories across the top

- The #1 language for data science

XLOOKUP:
- Modern replacement for VLOOKUP
- Simpler syntax: XLOOKUP(what, where, return)
- Can look in any direction, built-in error handling
- Use $ for absolute references

Pivot Tables:
- Summarize large data with drag-and-drop
- Rows, Columns, Values, and Filters
- Sum, average, count and more
- Great for reports and analysis

Python in Excel:
- =PY( starts Python mode, Ctrl+Enter runs it
- xl() to reference Excel data

2024-02-28,West,Filing Cabinet,Furniture,Dave,3,249,747`,gm=`# ============================================
# Python in Excel - Basic Introduction Script
# ============================================
# This script demonstrates basic Python concepts
# that can be used in Excel

# ----- VARIABLES AND DATA TYPES -----
# Numbers
sales_amount = 1500
tax_rate = 0.08

# Strings (text)
product_name = "Laptop"
customer = "John Smith"

# Calculations
tax_amount = sales_amount * tax_rate
total = sales_amount + tax_amount

print("Product:", product_name)
print("Customer:", customer)
print("Sales: $", sales_amount)
print("Tax: $", round(tax_amount, 2))
print("Total: $", round(total, 2))

# ----- LISTS (like Excel ranges) -----
monthly_sales = [1200, 1500, 1800, 1400, 2000, 2200]

# Calculate statistics
total_sales = sum(monthly_sales)
average_sales = sum(monthly_sales) / len(monthly_sales)
max_sales = max(monthly_sales)
min_sales = min(monthly_sales)

print("")
print("Monthly Sales Analysis:")
print("Total: $", total_sales)
print("Average: $", round(average_sales, 2))
print("Maximum: $", max_sales)
print("Minimum: $", min_sales)

# ----- SIMPLE LOOP -----
print("")
print("Sales by Month:")
months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"]
for i in range(len(months)):
    print("  ", months[i], ": $", monthly_sales[i])
`,vm=`# ============================================
# Python in Excel - Data Analysis Example
# ============================================
# Copy this code into Excel's Python cell

# First, import pandas (already available in Excel)
import pandas as pd

# ----- EXAMPLE 1: Basic DataFrame Operations -----
# In Excel, you can reference cell ranges like:
# df = xl("A1:D10", headers=True)

# For demonstration, let's create sample data:
data = {
    'Product': ['Laptop', 'Mouse', 'Keyboard', 'Monitor', 'Headset'],
    'Category': ['Electronics', 'Accessories', 'Accessories', 'Electronics', 'Accessories'],
    'Price': [999, 29, 79, 349, 89],
    'Quantity': [10, 50, 30, 15, 25]
}

df = pd.DataFrame(data)

# Calculate total value
df['Total_Value'] = df['Price'] * df['Quantity']

# Display the result
print(df)

# ----- EXAMPLE 2: Summary Statistics -----
print("")
print("--- Summary Statistics ---")
print("Total Revenue: $", df['Total_Value'].sum())
print("Average Price: $", round(df['Price'].mean(), 2))
print("Total Items:", df['Quantity'].sum())

# ----- EXAMPLE 3: Group By Category -----
print("")
print("--- Sales by Category ---")
category_summary = df.groupby('Category')['Total_Value'].sum()
print(category_summary)

# ----- EXAMPLE 4: Filtering Data -----
print("")
print("--- High Value Products (>$1000 total) ---")
high_value = df[df['Total_Value'] > 1000]
print(high_value[['Product', 'Total_Value']])

# Python in Excel - Creating Charts
# ============================================
# This script shows how to create visualizations

import pandas as pd
import matplotlib.pyplot as plt

# Sample sales data
data = {
    'Month': ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
    'Sales': [12000, 15000, 18000, 14000, 20000, 22000],
    'Expenses': [8000, 9500, 11000, 10000, 12000, 13000]
}

df = pd.DataFrame(data)

# Calculate Profit
df['Profit'] = df['Sales'] - df['Expenses']

# ----- CREATE A BAR CHART -----
plt.figure(figsize=(10, 6))
x = range(len(df['Month']))
width = 0.35

plt.bar([i - width/2 for i in x], df['Sales'], width, label='Sales', color='#2E7D32')
plt.bar([i + width/2 for i in x], df['Expenses'], width, label='Expenses', color='#C62828')

plt.xlabel('Month')
plt.ylabel('Amount ($)')
plt.title('Monthly Sales vs Expenses')
plt.xticks(x, df['Month'])
plt.legend()
plt.grid(axis='y', alpha=0.3)

# In Excel, the chart will appear in the cell
plt.show()

# ----- PROFIT LINE CHART -----
plt.figure(figsize=(10, 4))
plt.plot(df['Month'], df['Profit'], marker='o', linewidth=2, color='#1565C0')
plt.fill_between(df['Month'], df['Profit'], alpha=0.3, color='#1565C0')
plt.title('Monthly Profit Trend')
plt.xlabel('Month')
plt.ylabel('Profit ($)')
plt.grid(alpha=0.3)
plt.show()
